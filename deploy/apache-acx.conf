# deploy/apache-acx.conf
# VirtualHost Apache2 pour ACX (reverse proxy → Gunicorn)
#
# Installation :
#   sudo cp deploy/apache-acx.conf /etc/apache2/sites-available/acx.conf
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite acx
#   sudo systemctl reload apache2
#
# Remplacer "votre-domaine.com" par votre vrai domaine ou IP

<VirtualHost *:80>
    ServerName votre-domaine.com
    ServerAlias www.votre-domaine.com

    # ── Fichiers statiques servis directement par Apache ──────────────────────
    Alias /static/ /var/www/acx/staticfiles/
    <Directory /var/www/acx/staticfiles>
        Require all granted
        Options -Indexes
    </Directory>

    # ── Fichiers médias (uploads) ─────────────────────────────────────────────
    Alias /media/ /var/www/acx/media/
    <Directory /var/www/acx/media>
        Require all granted
        Options -Indexes
    </Directory>

    # ── Proxy vers Gunicorn (socket UNIX) ─────────────────────────────────────
    ProxyPreserveHost On
    ProxyPass /static/ !
    ProxyPass /media/  !
    ProxyPass        / unix:/run/gunicorn/acx.sock|http://localhost/
    ProxyPassReverse / unix:/run/gunicorn/acx.sock|http://localhost/

    # ── En-têtes de sécurité ──────────────────────────────────────────────────
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ── Logs ──────────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/acx-error.log
    CustomLog ${APACHE_LOG_DIR}/acx-access.log combined
</VirtualHost>

# ── HTTPS (à configurer après obtention du certificat SSL Let's Encrypt) ──────
# Après : sudo certbot --apache -d votre-domaine.com
# Certbot ajoutera automatiquement la config SSL
