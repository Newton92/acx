# deploy/apache-acx.conf
# Apache2 VirtualHost — ACX Backend API
# Domaine  : acx-acremac.net
# Certificat : DigiCert wildcard *.acx-acremac.net
#
# Installation sur le serveur :
#   sudo cp deploy/apache-acx.conf /etc/apache2/sites-available/acx.conf
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo a2ensite acx
#   sudo systemctl reload apache2

# ── HTTP : redirection permanente vers HTTPS ───────────────────────────────────
<VirtualHost *:80>
    ServerName  acx-acremac.net
    ServerAlias www.acx-acremac.net

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/acx-error.log
    CustomLog ${APACHE_LOG_DIR}/acx-access.log combined
</VirtualHost>

# ── HTTPS : backend Django via Gunicorn ───────────────────────────────────────
<VirtualHost *:443>
    ServerName  acx-acremac.net
    ServerAlias www.acx-acremac.net

    # ── SSL ───────────────────────────────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile    /etc/ssl/acx-acremac/star_acx-acremac_net.crt
    SSLCertificateKeyFile /etc/ssl/acx-acremac/acx-acremac.key
    SSLCertificateChainFile /etc/ssl/acx-acremac/My_CA_Bundle.crt

    # Protocoles et ciphers modernes (TLS 1.2 + 1.3)
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # ── Fichiers statiques servis directement par Apache ──────────────────────
    Alias /static/ /var/www/html/acx/staticfiles/
    <Directory /var/www/html/acx/staticfiles>
        Require all granted
        Options -Indexes
    </Directory>

    # ── Fichiers medias (uploads utilisateurs) ────────────────────────────────
    Alias /media/ /var/www/html/acx/media/
    <Directory /var/www/html/acx/media>
        Require all granted
        Options -Indexes
    </Directory>

    # ── Proxy vers Gunicorn via socket UNIX ───────────────────────────────────
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For   "%{REMOTE_ADDR}s"

    ProxyPass /static/ !
    ProxyPass /media/  !
    ProxyPass        / unix:/run/gunicorn/acx.sock|http://localhost/
    ProxyPassReverse / unix:/run/gunicorn/acx.sock|http://localhost/

    # ── En-tetes de securite ──────────────────────────────────────────────────
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set X-Frame-Options           "DENY"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"

    # ── CORS pour le frontend (a ajuster quand le front sera en ligne) ─────────
    # SetEnvIf Origin "^https://(www\.)?acx-acremac\.net$" CORS_ALLOW=1
    # Header always set Access-Control-Allow-Origin  "%{HTTP_ORIGIN}e" env=CORS_ALLOW
    # Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    # Header always set Access-Control-Allow-Headers "Authorization, Content-Type, Accept"
    # Header always set Access-Control-Allow-Credentials "true"

    # ── Logs ──────────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/acx-error.log
    CustomLog ${APACHE_LOG_DIR}/acx-access.log combined
</VirtualHost>
