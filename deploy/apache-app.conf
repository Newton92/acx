# deploy/apache-app.conf
# Apache2 VirtualHost — ACX Frontend (Next.js)
# Domaine  : app.acx-acremac.net
# Certificat : DigiCert wildcard *.acx-acremac.net (meme cert que le backend)
#
# Installation :
#   sudo cp deploy/apache-app.conf /etc/apache2/sites-available/acx-app.conf
#   sudo a2ensite acx-app
#   sudo systemctl reload apache2

# ── HTTP : redirection vers HTTPS ─────────────────────────────────────────────
<VirtualHost *:80>
    ServerName app.acx-acremac.net

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/acx-app-error.log
    CustomLog ${APACHE_LOG_DIR}/acx-app-access.log combined
</VirtualHost>

# ── HTTPS : proxy vers Next.js (port 3000) ────────────────────────────────────
<VirtualHost *:443>
    ServerName app.acx-acremac.net

    # ── SSL (meme certificat wildcard que le backend) ─────────────────────────
    SSLEngine on
    SSLCertificateFile      /etc/ssl/acx-acremac/star_acx-acremac_net.crt
    SSLCertificateKeyFile   /etc/ssl/acx-acremac/acx-acremac.key
    SSLCertificateChainFile /etc/ssl/acx-acremac/My_CA_Bundle.crt

    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # ── Proxy vers Next.js ────────────────────────────────────────────────────
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For   "%{REMOTE_ADDR}s"

    # Next.js gere lui-meme ses fichiers statiques via /_next/
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # ── Timeouts (Next.js peut prendre du temps au demarrage) ─────────────────
    ProxyTimeout 60

    # ── En-tetes securite ─────────────────────────────────────────────────────
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"

    # ── Logs ──────────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/acx-app-error.log
    CustomLog ${APACHE_LOG_DIR}/acx-app-access.log combined
</VirtualHost>
